# SecureSense dashboard on Render's FREE plan (no card needed).
#   - Web app: Render Free web service (HTTPS included). It sleeps after 15 min without
#     visitors unless an uptime monitor pings /healthz (see README "Free cloud hosting").
#   - Database: a free external Postgres (e.g. Neon) via DATABASE_URL, because a free
#     Render service has no permanent disk (a local SQLite file would be wiped).
# NEVER put Wi-Fi credentials, MQTT passwords, database URLs or local .env content in this file.
# Values marked "sync: false" are secrets: Render asks for them when you create the Blueprint.
services:
  - type: web
    name: securesense-dashboard
    runtime: node
    region: singapore
    plan: free
    rootDir: webapp
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_DAYS
        value: "7"
      - key: MQTT_URL
        value: mqtts://oea629d2.ala.asia-southeast1.emqxsl.com:8883
      - key: MQTT_TOPIC_PREFIX
        value: securesense/hub1
      - key: NODE_ID
        value: "2"
      - key: MQTT_USERNAME
        value: securesense-web
      - key: MQTT_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_USERNAME
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
